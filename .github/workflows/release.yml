name: Release

# 发布「错因本」dev release：跑质量门禁 → 注入版本号 → 签名出包 → 上传 GitHub Release。
#
# 触发方式：
#   1. 手动：Actions → Release → Run workflow，填 version / prerelease；
#   2. 推 tag：git push origin v0.0.1-dev，版本号自动取 tag 上的数字部分。
#
# 密钥来自仓库 Secrets（ANDROID_KEYSTORE_BASE64 等），缺失会在 preflight 步骤明确报错。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 0.0.1'
        required: true
        default: '0.0.1'
      prerelease:
        description: '标记为预发布（dev release 通常为 true）'
        type: boolean
        default: true
      notes:
        description: '发布说明；留空则自动汇总上次 tag 以来的提交'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 与 app/build.gradle.kts 里的读取逻辑同名，走环境变量可避免口令出现在命令行/日志里。
      ERRORBOOK_KEYSTORE: keystore/errorbook-release.p12
      ERRORBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ERRORBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ERRORBOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史来生成 release notes
          fetch-depth: 0

      - name: 解析版本号与 tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
            PRERELEASE=true
          else
            VERSION="$INPUT_VERSION"
            PRERELEASE="${{ inputs.prerelease }}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::版本号格式非法：$VERSION（期望 0.0.1 或 0.0.1-dev）"
            exit 1
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION  tag：v$VERSION  prerelease：$PRERELEASE"

      - name: Preflight — 校验签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ]                    || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ERRORBOOK_KEYSTORE_PASSWORD" ]     || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ERRORBOOK_KEY_ALIAS" ]             || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ERRORBOOK_KEY_PASSWORD" ]          || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少必要的 Secret：${missing[*]}"
            echo "请在 Settings → Secrets and variables → Actions 中配置；"
            echo "生成方式见仓库 scripts/generate-keystore.sh"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不使用 android-actions/setup-android：它内部会尝试安装早已被 Google 从 SDK
      # 仓库下线的遗留 `tools` 包，报 "Failed to find package 'tools'" 并让整步失败。
      # GitHub 托管 runner 已预装 Android SDK 与 cmdline-tools，直接用即可。
      # 去掉 setup-android 后，runner 虽然自带 cmdline-tools，但 sdkmanager 并不在
      # 默认 PATH 里。这里显式探测一次，并通过 GITHUB_PATH 让后续步骤都能用。
      - name: 定位 sdkmanager
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          sdk_bin=""
          for d in "${ANDROID_HOME}"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then
              sdk_bin="$d"
              break
            fi
          done
          if [ -z "$sdk_bin" ]; then
            echo "::error::在 ${ANDROID_HOME}/cmdline-tools/*/bin 下找不到可执行的 sdkmanager"
            ls -R "${ANDROID_HOME}/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "使用 sdkmanager：$sdk_bin/sdkmanager"
          echo "$sdk_bin" >> "$GITHUB_PATH"

      - name: 接受 SDK 许可
        run: |
          # 注意：GitHub Actions 的默认 shell 是
          #   bash --noprofile --norc -eo pipefail {0}
          # `-e` 是强加的，无法用 set 关掉。
          # `yes | sdkmanager --licenses` 在 sdkmanager 读完输入并退出后，
          # yes 会收到 SIGPIPE 返回 141；配合 pipefail 整条管道就是 141，
          # 于是脚本在「许可其实已全部接受」之后被 -e 中断。
          # 因此这里必须 `|| true` 忽略管道状态，真正的成败靠下面的落盘校验判断。
          yes | sdkmanager --licenses || true
          # platform-35 与 build-tools 35 都是稳定版，只需要 android-sdk-license。
          # 不额外要求 preview 许可：runner 预置的许可集未必包含它，会造成误报。
          if [ ! -f "${ANDROID_HOME}/licenses/android-sdk-license" ]; then
            echo "::error::缺少 android-sdk-license，SDK 许可未被接受"
            ls -la "${ANDROID_HOME}/licenses" 2>/dev/null || echo "(licenses 目录不存在)"
            exit 1
          fi
          echo "SDK 许可已接受 ✓"

      - name: 安装 SDK 组件
        run: |
          # 不信任退出码：许可缺失时 sdkmanager 会打印
          # "packages can not be installed since their licenses ... were not accepted"
          # 却仍以 0 退出；反之也可能非 0 但其实装好了。
          # gradle.properties 已开 android.builder.sdkDownload，装不上时 AGP 会兜底，
          # 所以非 0 只告警，成败一律按落盘校验。
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            || echo "::warning::sdkmanager 返回非 0，交由 AGP 自动补齐"

          missing=0
          [ -d "${ANDROID_HOME}/platforms/android-35" ] \
            || { echo "::error::缺 platforms;android-35"; missing=1; }
          ls -d "${ANDROID_HOME}"/build-tools/35.* >/dev/null 2>&1 \
            || { echo "::error::缺 build-tools;35.x"; missing=1; }
          [ -x "${ANDROID_HOME}/platform-tools/adb" ] \
            || echo "::warning::缺 platform-tools（不影响构建）"
          exit $missing

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ERRORBOOK_KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ERRORBOOK_KEYSTORE"
          test -s "$ERRORBOOK_KEYSTORE"
          # 密钥绝不进版本库：用 git 自身判断是否被忽略，作为兜底保险
          if ! git check-ignore -q "$ERRORBOOK_KEYSTORE"; then
            echo "::error::$ERRORBOOK_KEYSTORE 未被 .gitignore 忽略，拒绝继续"
            exit 1
          fi

      - name: 质量门禁（格式 + 单测 + Lint）
        run: ./gradlew --no-daemon :app:spotlessCheck :app:testDebugUnitTest :app:lintDebug

      - name: 构建签名 APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PVERSION_NAME="${{ steps.ver.outputs.version }}" \
            -PVERSION_CODE="${{ github.run_number }}"

      - name: 校验签名并收集产物
        run: |
          set -euo pipefail
          APK="$(ls -1 app/build/outputs/apk/release/*.apk | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -20

          mkdir -p dist
          OUT="dist/errorbook-${{ steps.ver.outputs.version }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/errorbook-${{ steps.ver.outputs.version }}.apk.sha256"
          cat "dist/errorbook-${{ steps.ver.outputs.version }}.apk.sha256"

      - name: 生成 Release 说明
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              NOTES="$(git log --pretty=format:'- %s (%h)' "$PREV"..HEAD)"
            else
              NOTES="$(git log --pretty=format:'- %s (%h)' -n 30)"
            fi
          fi
          {
            echo "## 错因本 v$VERSION"
            echo
            echo "$NOTES"
            echo
            echo '---'
            echo
            echo '- 安装包：`errorbook-'"$VERSION"'.apk`'
            echo '- 运行环境：HarmonyOS 4.x 及以下（Android 12 / API 31 AOSP 兼容层）'
            echo '- 全程离线：应用不联网，也未申请网络权限，OCR 为端侧内置模型'
          } > release-notes.md
          cat release-notes.md

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --title "错因本 v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            "${PRERELEASE_FLAG[@]}" \
            dist/*.apk dist/*.sha256
