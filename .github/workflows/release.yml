name: Release

# 发布「错因本」dev release：跑质量门禁 → 注入版本号 → 签名出包 → 上传 GitHub Release。
#
# 触发方式：
#   1. 手动：Actions → Release → Run workflow，填 version / prerelease；
#   2. 推 tag：git push origin v0.0.1-dev，版本号自动取 tag 上的数字部分。
#
# 密钥来自仓库 Secrets（ANDROID_KEYSTORE_BASE64 等），缺失会在 preflight 步骤明确报错。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 0.0.1'
        required: true
        default: '0.0.1'
      prerelease:
        description: '标记为预发布（dev release 通常为 true）'
        type: boolean
        default: true
      notes:
        description: '发布说明；留空则自动汇总上次 tag 以来的提交'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 与 app/build.gradle.kts 里的读取逻辑同名，走环境变量可避免口令出现在命令行/日志里。
      ERRORBOOK_KEYSTORE: keystore/errorbook-release.p12
      ERRORBOOK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ERRORBOOK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ERRORBOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史来生成 release notes
          fetch-depth: 0

      - name: 解析版本号与 tag
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
            PRERELEASE=true
          else
            VERSION="$INPUT_VERSION"
            PRERELEASE="${{ inputs.prerelease }}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::版本号格式非法：$VERSION（期望 0.0.1 或 0.0.1-dev）"
            exit 1
          fi
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION  tag：v$VERSION  prerelease：$PRERELEASE"

      - name: Preflight — 校验签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ]                    || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ERRORBOOK_KEYSTORE_PASSWORD" ]     || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ERRORBOOK_KEY_ALIAS" ]             || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ERRORBOOK_KEY_PASSWORD" ]          || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少必要的 Secret：${missing[*]}"
            echo "请在 Settings → Secrets and variables → Actions 中配置；"
            echo "生成方式见仓库 scripts/generate-keystore.sh"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ERRORBOOK_KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ERRORBOOK_KEYSTORE"
          test -s "$ERRORBOOK_KEYSTORE"
          # 密钥绝不进版本库：用 git 自身判断是否被忽略，作为兜底保险
          if ! git check-ignore -q "$ERRORBOOK_KEYSTORE"; then
            echo "::error::$ERRORBOOK_KEYSTORE 未被 .gitignore 忽略，拒绝继续"
            exit 1
          fi

      - name: 质量门禁（格式 + 单测 + Lint）
        run: ./gradlew --no-daemon :app:spotlessCheck :app:testDebugUnitTest :app:lintDebug

      - name: 构建签名 APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PVERSION_NAME="${{ steps.ver.outputs.version }}" \
            -PVERSION_CODE="${{ github.run_number }}"

      - name: 校验签名并收集产物
        run: |
          set -euo pipefail
          APK="$(ls -1 app/build/outputs/apk/release/*.apk | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -20

          mkdir -p dist
          OUT="dist/errorbook-${{ steps.ver.outputs.version }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "dist/errorbook-${{ steps.ver.outputs.version }}.apk.sha256"
          cat "dist/errorbook-${{ steps.ver.outputs.version }}.apk.sha256"

      - name: 生成 Release 说明
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ]; then
            PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              NOTES="$(git log --pretty=format:'- %s (%h)' "$PREV"..HEAD)"
            else
              NOTES="$(git log --pretty=format:'- %s (%h)' -n 30)"
            fi
          fi
          {
            echo "## 错因本 v$VERSION"
            echo
            echo "$NOTES"
            echo
            echo '---'
            echo
            echo '- 安装包：`errorbook-'"$VERSION"'.apk`'
            echo '- 运行环境：HarmonyOS 4.x 及以下（Android 12 / API 31 AOSP 兼容层）'
            echo '- 全程离线：应用不联网，也未申请网络权限，OCR 为端侧内置模型'
          } > release-notes.md
          cat release-notes.md

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --title "错因本 v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            "${PRERELEASE_FLAG[@]}" \
            dist/*.apk dist/*.sha256
